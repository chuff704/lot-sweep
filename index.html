<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot Sweep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E7EAF1; --surface-hover:#DEE2EC;
    --text:#11151D; --text-muted:#5A6178; --text-faint:#8890A3;
    --border:#D5D9E3; --border-strong:#B9C0D0;
    --accent:#E24A1E; --accent-hover:#C93E17; --accent-ink:#FFFFFF; --accent-soft:#FBE4DA;
    --ok:#17825A; --ok-bg:#DFF3E9;
    --warn:#9C6B05; --warn-bg:#FAEFD6;
    --info:#285FA6; --info-bg:#E2ECFA;
    --neutral:#5A6178; --neutral-bg:#E7E9F0;
    --shadow:0 1px 2px rgba(20,24,38,.07), 0 10px 26px -14px rgba(20,24,38,.22);
    --focus-ring:0 0 0 3px rgba(226,74,30,.35);
    --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C0F15; --surface:#151A22; --surface-2:#1D2430; --surface-hover:#242C3A;
      --text:#E7EAF2; --text-muted:#9AA2B8; --text-faint:#6C7386;
      --border:#2A3140; --border-strong:#3A4356;
      --accent:#FF6A3B; --accent-hover:#FF875C; --accent-ink:#180C06; --accent-soft:#3A1D12;
      --ok:#3FCB92; --ok-bg:#0F3323;
      --warn:#E7B64A; --warn-bg:#3A2C0C;
      --info:#6CA3EC; --info-bg:#152A44;
      --neutral:#9AA2B8; --neutral-bg:#1D2430;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.65);
      --focus-ring:0 0 0 3px rgba(255,106,59,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C0F15; --surface:#151A22; --surface-2:#1D2430; --surface-hover:#242C3A;
    --text:#E7EAF2; --text-muted:#9AA2B8; --text-faint:#6C7386;
    --border:#2A3140; --border-strong:#3A4356;
    --accent:#FF6A3B; --accent-hover:#FF875C; --accent-ink:#180C06; --accent-soft:#3A1D12;
    --ok:#3FCB92; --ok-bg:#0F3323;
    --warn:#E7B64A; --warn-bg:#3A2C0C;
    --info:#6CA3EC; --info-bg:#152A44;
    --neutral:#9AA2B8; --neutral-bg:#1D2430;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.65);
    --focus-ring:0 0 0 3px rgba(255,106,59,.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:640px; margin:0 auto; padding-inline:18px;}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft); color:var(--text);}
  :focus-visible{outline:none; box-shadow:var(--focus-ring); border-radius:6px;}

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding-block:12px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px; height:30px; border-radius:7px; flex:none;
    background:linear-gradient(155deg, var(--accent), var(--accent-hover));
    position:relative; overflow:hidden;
  }
  .brand-mark::before{
    content:""; position:absolute; inset:7px 5px; border-radius:2px;
    background:repeating-linear-gradient(90deg, var(--accent-ink) 0 2px, transparent 2px 4px, var(--accent-ink) 4px 5px, transparent 5px 8px, var(--accent-ink) 8px 9px, transparent 9px 13px);
    opacity:.92;
  }
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:1.4rem; letter-spacing:.01em;}
  .store-picker{display:flex; flex-direction:column; align-items:flex-end; gap:1px;}
  .store-picker-label{font-size:.6875rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint);}
  .store-picker select{
    font-family:var(--font-body); font-weight:600; font-size:.8125rem; color:var(--text);
    background:transparent; border:none; padding:1px 18px 1px 0; margin:0;
    appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position:right 5px top 45%, right 0px top 45%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    text-align:right; cursor:pointer;
  }

  /* ---------- stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding-block:16px 4px;}
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 10px; display:flex; flex-direction:column; gap:2px;
  }
  .stat-value{font-family:var(--font-display); font-weight:700; font-size:1.75rem; font-variant-numeric:tabular-nums; line-height:1.05;}
  .stat-label{font-size:.6875rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}

  /* ---------- primary action ---------- */
  .primary-action-row{padding-block:14px 6px; display:flex; flex-direction:column; gap:7px;}
  .primary-action-hint{font-size:.8125rem; color:var(--text-muted);}
  .primary-action-hint strong{color:var(--text); font-weight:600;}

  .btn{
    border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
    font-weight:600; font-size:.875rem; padding:9px 15px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    transition:background-color .12s ease, border-color .12s ease, transform .05s ease;
  }
  .btn:hover{background:var(--surface-hover);}
  .btn:active{transform:translateY(1px);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-accent:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
  .btn-lg{padding:13px 18px; font-size:.9375rem; width:100%;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted); padding:6px 4px;}
  .btn-ghost:hover{background:transparent; color:var(--text); text-decoration:underline;}
  .btn-danger{background:transparent; border-color:var(--border); color:#C0392B;}
  .btn-block{width:100%;}

  /* ---------- notice ---------- */
  .notice{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    background:var(--info-bg); border:1px solid color-mix(in srgb, var(--info) 35%, transparent);
    color:var(--text); border-radius:9px; padding:10px 12px; font-size:.8125rem; margin-block:10px 14px;
  }
  .notice p{color:var(--text); line-height:1.45;}
  .notice button{
    background:none; border:none; color:var(--info); font-weight:600; font-size:.75rem;
    cursor:pointer; white-space:nowrap; padding:2px 0;
  }

  /* ---------- sections ---------- */
  .section-heading{display:flex; align-items:baseline; justify-content:space-between; padding-top:10px;}
  .section-heading h2{font-size:1.125rem;}
  .sessions{padding-bottom:36px;}

  /* ---------- session list ---------- */
  .session-list{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:9px;}
  .session-card{
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:12px 14px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px;
  }
  .session-card:hover{border-color:var(--border-strong);}
  .session-card-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .session-id{font-family:var(--font-mono); font-weight:600; font-size:.9375rem; letter-spacing:.02em;}
  .store-chip{
    font-size:.6875rem; font-weight:600; color:var(--text-muted); background:var(--surface-2);
    border-radius:99px; padding:3px 9px; white-space:nowrap;
  }
  .session-card-meta{font-size:.8125rem; color:var(--text-muted); display:flex; gap:6px;}
  .session-card-statuses{display:flex; flex-wrap:wrap; gap:6px;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:.6875rem; font-weight:600;
    padding:3px 9px; border-radius:99px; white-space:nowrap; line-height:1.4;
  }
  .pill-dot{width:6px; height:6px; border-radius:99px; background:currentColor; flex:none;}
  .pill-info{background:var(--info-bg); color:var(--info);}
  .pill-warn{background:var(--warn-bg); color:var(--warn);}
  .pill-ok{background:var(--ok-bg); color:var(--ok);}
  .pill-neutral{background:var(--neutral-bg); color:var(--neutral);}

  /* ---------- session detail ---------- */
  .session-detail{padding-bottom:40px;}
  .back-link{
    background:none; border:none; color:var(--text-muted); font-weight:600; font-size:.8125rem;
    padding:14px 0 4px; cursor:pointer;
  }
  .back-link:hover{color:var(--text);}
  .session-detail-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
    padding-block:6px 14px; flex-wrap:wrap;
  }
  .session-detail-actions{display:flex; gap:8px;}
  .session-detail-head h2{font-size:1.75rem; font-family:var(--font-mono); letter-spacing:.01em;}
  .muted{color:var(--text-muted); font-size:.8125rem; margin-top:2px;}

  .vehicle-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
  .vehicle-card{
    position:relative; display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:12px 14px 12px 16px; cursor:pointer; box-shadow:var(--shadow); overflow:hidden;
  }
  .vehicle-card:hover{border-color:var(--border-strong);}
  .status-stripe{position:absolute; left:0; top:0; bottom:0; width:4px;}
  .status-pending .status-stripe{background:var(--info);}
  .status-recon .status-stripe{background:var(--warn);}
  .status-stocked .status-stripe{background:var(--ok);}
  .vehicle-card-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
  .vehicle-idline{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .vehicle-stock{font-family:var(--font-mono); font-size:.8125rem; font-weight:700; letter-spacing:.02em; color:var(--text);}
  .vehicle-stock.is-muted{font-weight:500; font-style:italic; color:var(--text-faint);}
  .vehicle-vin{font-family:var(--font-mono); font-size:.75rem; letter-spacing:.02em; color:var(--text-faint);}
  .vehicle-title{font-weight:600; font-size:.9375rem;}
  .vehicle-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .chev{color:var(--text-faint); font-size:1.25rem; flex:none;}
  .empty-state{
    text-align:center; color:var(--text-muted); font-size:.875rem;
    border:1px dashed var(--border-strong); border-radius:11px; padding:28px 16px;
  }

  /* ---------- modal shell (vehicle editor) ---------- */
  .modal-scrim{
    position:fixed; inset:0; background:rgba(10,12,18,.5); backdrop-filter:blur(1px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0;
  }
  @media (min-width:560px){
    .modal-scrim{align-items:center; padding:24px;}
  }
  .modal-panel{
    background:var(--surface); width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
    border-radius:16px 16px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.25);
    display:flex; flex-direction:column;
  }
  @media (min-width:560px){
    .modal-panel{border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  }
  .modal-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:16px 18px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface);
  }
  .modal-vin{font-family:var(--font-mono); font-size:1.125rem; font-weight:600; letter-spacing:.02em; word-break:break-all;}
  .modal-close{background:none; border:none; color:var(--text-muted); font-size:1.25rem; line-height:1; cursor:pointer; padding:4px;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:14px 18px 20px; display:flex; flex-direction:column; gap:16px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:.6875rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);}
  .field input, .field select{
    font-family:var(--font-body); font-size:.875rem; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .badge-row{display:flex; flex-wrap:wrap; gap:6px;}
  .modal-footer{
    display:flex; gap:10px; padding:14px 18px 18px; border-top:1px solid var(--border);
  }

  /* ---------- scanner overlay ---------- */
  .scanner-scrim{position:fixed; inset:0; background:#05070B; z-index:60; display:flex; flex-direction:column;}
  .scanner-top{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    color:#EDEFF4;
  }
  .scanner-tally{font-size:.8125rem; color:#B9C0D0; font-weight:600;}
  .scanner-x{background:none; border:none; color:#EDEFF4; font-size:1.5rem; line-height:1; cursor:pointer; padding:4px 8px;}
  .scanner-stage{position:relative; flex:1; min-height:0; overflow:hidden; background:#000;}
  .scanner-viewport{position:absolute; inset:0;}
  .scanner-viewport video, .scanner-viewport canvas{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .scanner-reticle-wrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;}
  .scanner-reticle{position:relative; width:78%; max-width:360px; aspect-ratio:16/7;}
  .scanner-corner{position:absolute; width:26px; height:26px; border:3px solid var(--accent);}
  .scanner-corner.tl{top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0;}
  .scanner-corner.tr{top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0;}
  .scanner-corner.bl{bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px;}
  .scanner-corner.br{bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0;}
  .scanner-reticle.is-reading .scanner-corner{border-color:#3FCB92;}
  .scanner-scanline{
    position:absolute; left:4%; right:4%; top:8%; height:2px; background:var(--accent);
    box-shadow:0 0 8px 1px var(--accent); border-radius:2px;
  }
  @media (prefers-reduced-motion: no-preference){
    .scanner-scanline{animation:sweep 1.9s ease-in-out infinite;}
  }
  @keyframes sweep{
    0%,100%{top:8%;} 50%{top:88%;}
  }
  .scanner-hint{position:absolute; left:0; right:0; bottom:14px; text-align:center; color:#C7CCD9; font-size:.8125rem;}
  .scanner-debug{position:absolute; left:0; right:0; bottom:38px; text-align:center; color:#6E7690; font-size:.6875rem; font-family:var(--font-mono); padding:0 10px; overflow-wrap:break-word;}
  .scanner-error{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:#C7CCD9; text-align:center; padding:0 24px; font-size:.875rem;
  }
  .scanner-bottom{padding:14px 16px 20px; display:flex; flex-direction:column; gap:10px; background:#0B0E14;}
  .scanner-link-row{text-align:center;}
  .scanner-link{background:none; border:none; color:#E9A489; font-weight:600; font-size:.8125rem; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

  .manual-panel{flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 22px; gap:14px; color:#EDEFF4;}
  .manual-panel h3{font-size:1.25rem; color:#EDEFF4;}
  .manual-panel p{color:#9AA2B8; font-size:.8125rem;}
  .manual-input{
    width:100%; font-family:var(--font-mono); font-size:1.0625rem; letter-spacing:.04em;
    background:#161A22; color:#EDEFF4; border:1px solid #2A3140; border-radius:9px; padding:12px 13px;
    text-transform:uppercase;
  }
  .manual-input:focus{border-color:var(--accent); outline:none;}
  .manual-feedback{font-size:.75rem; min-height:1em;}

  .confirm-panel{
    flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px;
    padding:0 24px; text-align:center; color:#EDEFF4;
  }
  .confirm-vin{font-family:var(--font-mono); font-size:1.375rem; font-weight:600; letter-spacing:.03em; word-break:break-all;}
  .confirm-sub{color:#9AA2B8; font-size:.875rem;}
  .confirm-actions{display:flex; gap:10px; width:100%; max-width:340px;}
  .confirm-actions .btn{flex:1;}

  @media (max-width:400px){
    .field-row{grid-template-columns:1fr;}
    .brand-name{font-size:1.2rem;}
  }

  /* ---------- print label ---------- */
  .print-scrim{
    position:fixed; inset:0; background:rgba(10,12,18,.6); z-index:70;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow-y:auto; padding:22px 16px 32px;
  }
  .print-scrim-top{width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .print-scrim-title{color:#EDEFF4; font-family:var(--font-display); font-weight:600; font-size:1.125rem;}
  .print-scrim-close{background:none; border:none; color:#EDEFF4; font-size:1.5rem; line-height:1; cursor:pointer; padding:4px 8px;}
  .print-scrim-hint{width:100%; max-width:520px; color:#9AA2B8; font-size:.75rem; margin:-8px 0 16px;}
  .print-stage{background:#3A3E48; padding:26px; border-radius:12px; display:flex; justify-content:center;}
  .print-label{
    width:4in; height:3in; background:#FFFFFF; color:#000000;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transform:scale(1.35); transform-origin:center; margin:34px 24px;
  }
  .print-scrim-actions{width:100%; max-width:520px; display:flex; gap:10px; margin-top:18px;}
  .print-scrim-actions .btn{flex:1;}
  .print-scrim-actions .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .print-check-panel{
    width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; display:flex; flex-direction:column;
  }
  .print-check-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--border);
    font-size:.75rem; font-weight:600; color:var(--text-muted);
  }
  .print-check-links{display:flex; gap:10px;}
  .print-check-links button{
    background:none; border:none; color:var(--accent); font-weight:700; font-size:.75rem;
    cursor:pointer; padding:2px 0; text-transform:uppercase; letter-spacing:.04em;
  }
  .print-check-list{max-height:46vh; overflow-y:auto;}
  .print-check-row{
    display:flex; align-items:flex-start; gap:11px; padding:11px 14px;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .print-check-row:last-child{border-bottom:none;}
  .print-check-row:hover{background:var(--surface-hover);}
  .print-check{margin-top:3px; width:17px; height:17px; accent-color:var(--accent); flex:none; cursor:pointer;}
  .print-check-main{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .print-check-title{display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-weight:700; font-size:.875rem;}
  .print-check-sub{font-size:.75rem; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .pl-inner{width:100%; height:100%; box-sizing:border-box; padding:.14in .16in; font-family:var(--font-body); display:flex; flex-direction:column; gap:.05in;}
  .pl-header{display:flex; align-items:baseline; justify-content:space-between; border-bottom:1.2pt solid #000; padding-bottom:.04in;}
  .pl-store{font-size:7.5pt; font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .pl-session{font-family:var(--font-mono); font-size:7.5pt;}
  .pl-stock-label{font-size:6.5pt; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#000;}
  .pl-stock{font-family:var(--font-display); font-weight:700; font-size:23pt; line-height:1; letter-spacing:.01em;}
  .pl-stock.pl-empty{font-size:12pt; font-style:italic; font-weight:500;}
  .pl-barcode-wrap{display:flex; flex-direction:column; align-items:center; gap:0;}
  .pl-barcode-wrap svg{width:100%; max-width:3.5in; height:.46in;}
  .pl-vin{font-family:var(--font-mono); font-size:8.5pt; letter-spacing:.05em; text-align:center;}
  .pl-title{font-weight:700; font-size:12.5pt; line-height:1.15; text-wrap:balance;}
  .pl-grid{display:grid; grid-template-columns:1fr 1fr; gap:.03in .14in; border-top:.8pt solid #000; padding-top:.05in;}
  .pl-cell{display:flex; flex-direction:column; line-height:1.15;}
  .pl-cell-label{font-size:6pt; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#333;}
  .pl-cell-value{font-size:8pt; font-weight:600;}
  .pl-footer{margin-top:auto; display:flex; justify-content:space-between; font-size:6pt; color:#333; border-top:.6pt solid #999; padding-top:.03in;}

  .print-notice{font-size:.75rem; color:var(--text-muted); text-align:center; min-height:1.2em; width:100%; max-width:520px;}
  .print-notice.is-error{color:#E0563E;}
</style>
</head>
<body>


<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ VIN decoding ============ */
  var TRANSLIT = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  var WEIGHTS = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  var YEAR_CODE = {A:2010,B:2011,C:2012,D:2013,E:2014,F:2015,G:2016,H:2017,J:2018,K:2019,L:2020,M:2021,N:2022,P:2023,R:2024,S:2025,T:2026,V:2027,W:2028,X:2029,Y:2030,
    1:2031,2:2032,3:2033,4:2034,5:2035,6:2036,7:2037,8:2038,9:2039};
  var WMI = {
    KMH:"Hyundai", KM8:"Hyundai", "5NP":"Hyundai", "5NM":"Hyundai", KMF:"Hyundai",
    KNA:"Kia", KND:"Kia", "5XY":"Kia", "5XX":"Kia",
    "1N4":"Nissan", "3N1":"Nissan", JN1:"Nissan", JN8:"Nissan", "1N6":"Nissan",
    "4T1":"Toyota", "4T3":"Toyota", "5TD":"Toyota", "2T1":"Toyota", JTD:"Toyota", "5TF":"Toyota",
    "1FA":"Ford", "1FT":"Ford", "3FA":"Ford", "1FM":"Ford",
    "1G1":"Chevrolet", "1GC":"Chevrolet", "3GN":"Chevrolet", "1GN":"Chevrolet",
    "1GT":"GMC", "3GT":"GMC",
    "1C4":"Jeep", "1C6":"Ram", "3C6":"Ram", "2C3":"Chrysler",
    "1HG":"Honda", "2HG":"Honda", "5FN":"Honda", "19X":"Honda",
    WVW:"Volkswagen", "3VW":"Volkswagen",
    WBA:"BMW", "5UX":"BMW",
    WDD:"Mercedes-Benz", "4JG":"Mercedes-Benz",
    JM1:"Mazda", JM3:"Mazda",
    "4S3":"Subaru", "4S4":"Subaru", JF1:"Subaru", JF2:"Subaru",
    "5YJ":"Tesla", "7SA":"Tesla"
  };

  function vinFormatOk(v){ return /^[A-HJ-NPR-Z0-9]{17}$/i.test(v); }

  function vinChecksumValid(v){
    if(!vinFormatOk(v)) return false;
    v = v.toUpperCase();
    var sum = 0;
    for(var i=0;i<17;i++){
      var ch = v[i];
      var val = /[0-9]/.test(ch) ? parseInt(ch,10) : (TRANSLIT[ch] || 0);
      sum += val * WEIGHTS[i];
    }
    var rem = sum % 11;
    var expect = rem === 10 ? "X" : String(rem);
    return v[8] === expect;
  }

  function decodeVin(v){
    var out = {formatOk:false, checksumValid:false, year:null, make:null};
    if(!vinFormatOk(v)) return out;
    v = v.toUpperCase();
    out.formatOk = true;
    out.checksumValid = vinChecksumValid(v);
    var wmi = v.slice(0,3);
    out.make = WMI[wmi] || null;
    var yc = v[9];
    var base = YEAR_CODE[yc] !== undefined ? YEAR_CODE[yc] : null;
    if(base !== null){
      var pos7IsDigit = /[0-9]/.test(v[6]);
      out.year = pos7IsDigit ? base - 30 : base;
    }
    return out;
  }

  /* ============ constants ============ */
  var STORES = ["Hyundai of Louisville", "Fred Martin Nissan"];
  var LOCATIONS = ["Front Row", "Service Drive", "Detail Bay", "Back Lot", "Showroom"];
  var STATUSES = ["Scanned – Pending Stock-In", "Held – Recon", "Stocked In"];
  var LABELS = ["Not Printed", "Printed"];
  var STORAGE_KEY = "lotsweep_state_v1";

  function statusKey(s){
    if(s === STATUSES[2]) return "stocked";
    if(s === STATUSES[1]) return "recon";
    return "pending";
  }
  function statusPillClass(s){
    var k = statusKey(s);
    return k === "stocked" ? "pill-ok" : (k === "recon" ? "pill-warn" : "pill-info");
  }

  /* ============ seed data ============ */
  function seedState(){
    return {
      activeStore: STORES[0],
      nextSessionNum: 1044,
      nextVehicleNum: 4,
      sampleNoticeDismissed: false,
      sessions: [
        {
          id: "VS-1042", store: "Hyundai of Louisville", createdAt: "2026-09-14T09:12:00",
          vehicles: [
            {id:"v1", vin:"KMHD35LC0RA123456", vinSource:"Scanned", stockNumber:"H240918", addedAt:"2026-09-14T09:14:00", year:2024, make:"Hyundai", model:"Elantra", trim:"SEL", engine:"2.0L I4", transmission:"IVT (CVT)", location:"Showroom", status:STATUSES[2], labelStatus:"Printed"},
            {id:"v2", vin:"4T1B11FKXNK445566", vinSource:"Scanned", stockNumber:"", addedAt:"2026-09-14T09:21:00", year:2022, make:"Toyota", model:"Camry", trim:"LE (trade-in)", engine:"2.5L I4", transmission:"8-Speed Automatic", location:"Detail Bay", status:STATUSES[1], labelStatus:"Not Printed"}
          ]
        },
        {
          id: "VS-1043", store: "Fred Martin Nissan", createdAt: "2026-09-13T15:40:00",
          vehicles: [
            {id:"v3", vin:"1N4AL3FP0PC654321", vinSource:"Scanned", stockNumber:"", addedAt:"2026-09-13T15:44:00", year:2023, make:"Nissan", model:"Altima", trim:"SV", engine:"", transmission:"", location:"Back Lot", status:STATUSES[0], labelStatus:"Not Printed"}
          ]
        }
      ]
    };
  }

  function loadPersisted(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.sessions)) return parsed;
      }
    }catch(e){}
    return seedState();
  }
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ============ app state ============ */
  var state = null;
  var view = { screen:"home", sessionId:null, editingVehicleId:null };
  var scanner = { open:false, mode:"camera", pendingVin:null, addedCount:0, cameraError:null, manualValue:"", lastRead:null, lastReadStreak:0 };
  var quaggaActive = false;
  var printState = null; /* {sessionId, vehicleId} */

  function findSession(id){
    for(var i=0;i<state.sessions.length;i++) if(state.sessions[i].id === id) return state.sessions[i];
    return null;
  }
  function findVehicle(session, id){
    for(var i=0;i<session.vehicles.length;i++) if(session.vehicles[i].id === id) return session.vehicles[i];
    return null;
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtWhen(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var yest = new Date(now); yest.setDate(now.getDate()-1);
    var isYest = d.toDateString() === yest.toDateString();
    var time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    if(sameDay) return "Today, " + time;
    if(isYest) return "Yesterday, " + time;
    return d.toLocaleDateString([], {month:"short", day:"numeric"}) + ", " + time;
  }

  /* ============ rendering ============ */
  function render(){
    var app = document.getElementById("app");
    var html = renderHeader();
    if(view.screen === "home"){
      html += renderHome();
    } else {
      html += renderSessionDetail();
    }
    var modalHtml = "";
    if(view.editingVehicleId){
      modalHtml = renderVehicleModal();
    }
    var scannerHtml = "";
    if(scanner.open){
      scannerHtml = renderScanner();
    }
    var printHtml = "";
    if(printState){
      printHtml = renderPrintLabel();
    }
    app.innerHTML = html + modalHtml + scannerHtml + printHtml;
    wireEvents();
    afterRender();
  }

  function renderHeader(){
    var options = STORES.map(function(s){
      return "<option value=\"" + escapeHtml(s) + "\"" + (s === state.activeStore ? " selected" : "") + ">" + escapeHtml(s) + "</option>";
    }).join("");
    return (
      "<header class=\"topbar\"><div class=\"topbar-inner shell\">" +
        "<div class=\"brand\"><span class=\"brand-mark\" aria-hidden=\"true\"></span><span class=\"brand-name\">Lot Sweep</span></div>" +
        "<label class=\"store-picker\"><span class=\"store-picker-label\">Working at</span>" +
          "<select id=\"activeStoreSelect\">" + options + "</select>" +
        "</label>" +
      "</div></header>"
    );
  }

  function renderHome(){
    var total = 0, pending = 0, stocked = 0;
    state.sessions.forEach(function(s){
      s.vehicles.forEach(function(v){
        total++;
        if(statusKey(v.status) === "pending") pending++;
        if(statusKey(v.status) === "stocked") stocked++;
      });
    });

    var sessionsHtml = state.sessions.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); }).map(function(s){
      var counts = {pending:0, recon:0, stocked:0};
      s.vehicles.forEach(function(v){ counts[statusKey(v.status)]++; });
      var chips = [];
      if(counts.pending) chips.push("<span class=\"pill pill-info\">" + counts.pending + " pending</span>");
      if(counts.recon) chips.push("<span class=\"pill pill-warn\">" + counts.recon + " in recon</span>");
      if(counts.stocked) chips.push("<span class=\"pill pill-ok\">" + counts.stocked + " stocked in</span>");
      if(!chips.length) chips.push("<span class=\"pill pill-neutral\">No vehicles yet</span>");
      return (
        "<li class=\"session-card\" data-open-session=\"" + escapeHtml(s.id) + "\">" +
          "<div class=\"session-card-top\"><span class=\"session-id\">" + escapeHtml(s.id) + "</span><span class=\"store-chip\">" + escapeHtml(s.store) + "</span></div>" +
          "<div class=\"session-card-meta\"><span>" + s.vehicles.length + " vehicle" + (s.vehicles.length===1?"":"s") + "</span><span>·</span><span>" + fmtWhen(s.createdAt) + "</span></div>" +
          "<div class=\"session-card-statuses\">" + chips.join("") + "</div>" +
        "</li>"
      );
    }).join("");

    var notice = "";
    if(!state.sampleNoticeDismissed){
      notice = "<div class=\"notice\"><p>These two sessions are sample data so you can see how Lot Sweep works. Start a new scan to log a real vehicle.</p><button id=\"dismissNotice\" type=\"button\">Got it</button></div>";
    }

    return (
      "<main class=\"shell\">" +
        "<section class=\"stats\">" +
          "<div class=\"stat-tile\"><span class=\"stat-value\">" + total + "</span><span class=\"stat-label\">Vehicles logged</span></div>" +
          "<div class=\"stat-tile\"><span class=\"stat-value\">" + pending + "</span><span class=\"stat-label\">Pending stock-in</span></div>" +
          "<div class=\"stat-tile\"><span class=\"stat-value\">" + stocked + "</span><span class=\"stat-label\">Stocked in</span></div>" +
        "</section>" +
        "<div class=\"primary-action-row\">" +
          "<button id=\"startSessionBtn\" type=\"button\" class=\"btn btn-accent btn-lg\">Start new scan session</button>" +
          "<p class=\"primary-action-hint\">Scans a VIN barcode and opens a session at <strong>" + escapeHtml(state.activeStore) + "</strong>.</p>" +
        "</div>" +
      "</main>" +
      "<section class=\"shell sessions\">" +
        "<div class=\"section-heading\"><h2>Scan sessions</h2></div>" +
        notice +
        "<ul class=\"session-list\">" + sessionsHtml + "</ul>" +
      "</section>"
    );
  }

  function renderSessionDetail(){
    var s = findSession(view.sessionId);
    if(!s){ view.screen = "home"; return renderHome(); }
    var rows = s.vehicles.map(function(v){
      var title = [v.year || "", v.make || "Unknown make", v.model || ""].filter(Boolean).join(" ") + (v.trim ? " " + v.trim : "");
      return (
        "<li class=\"vehicle-card status-" + statusKey(v.status) + "\" data-open-vehicle=\"" + escapeHtml(v.id) + "\">" +
          "<span class=\"status-stripe\" aria-hidden=\"true\"></span>" +
          "<div class=\"vehicle-card-main\">" +
            "<div class=\"vehicle-idline\">" +
              (v.stockNumber ? "<span class=\"vehicle-stock\">#" + escapeHtml(v.stockNumber) + "</span>" : "<span class=\"vehicle-stock is-muted\">No stock #</span>") +
              "<span class=\"vehicle-vin\">" + escapeHtml(v.vin) + "</span>" +
            "</div>" +
            "<div class=\"vehicle-title\">" + escapeHtml(title || "Unidentified vehicle") + "</div>" +
            "<div class=\"vehicle-tags\">" +
              "<span class=\"pill " + statusPillClass(v.status) + "\">" + escapeHtml(v.status) + "</span>" +
              "<span class=\"pill pill-neutral\">" + escapeHtml(v.location) + "</span>" +
              "<span class=\"pill " + (v.labelStatus === "Printed" ? "pill-ok" : "pill-neutral") + "\">" + escapeHtml(v.labelStatus) + "</span>" +
            "</div>" +
          "</div>" +
          "<span class=\"chev\" aria-hidden=\"true\">›</span>" +
        "</li>"
      );
    }).join("");

    return (
      "<main class=\"shell session-detail\">" +
        "<button id=\"backBtn\" type=\"button\" class=\"back-link\">‹ All sessions</button>" +
        "<div class=\"session-detail-head\">" +
          "<div><h2>" + escapeHtml(s.id) + "</h2><p class=\"muted\">" + escapeHtml(s.store) + " · started " + fmtWhen(s.createdAt) + "</p></div>" +
          "<div class=\"session-detail-actions\">" +
            (s.vehicles.length ? "<button id=\"printSessionBtn\" type=\"button\" class=\"btn\">Print labels</button>" : "") +
            "<button id=\"scanMoreBtn\" type=\"button\" class=\"btn btn-accent\">Scan vehicle</button>" +
          "</div>" +
        "</div>" +
        (s.vehicles.length ?
          "<ul class=\"vehicle-list\">" + rows + "</ul>" :
          "<div class=\"empty-state\">No vehicles scanned into this session yet.<br>Tap “Scan vehicle” to add one.</div>"
        ) +
      "</main>"
    );
  }

  function renderVehicleModal(){
    var s = findSession(view.sessionId);
    var v = s ? findVehicle(s, view.editingVehicleId) : null;
    if(!v){ return ""; }
    var decoded = decodeVin(v.vin);
    var badges = "<span class=\"pill pill-neutral\">" + escapeHtml(v.vinSource) + "</span>";
    badges += decoded.checksumValid ? "<span class=\"pill pill-ok\">Checksum valid</span>" : "<span class=\"pill pill-warn\">Checksum mismatch</span>";

    function opts(list, current){
      return list.map(function(o){ return "<option value=\"" + escapeHtml(o) + "\"" + (o===current?" selected":"") + ">" + escapeHtml(o) + "</option>"; }).join("");
    }

    return (
      "<div class=\"modal-scrim\" id=\"vehicleModalScrim\">" +
        "<div class=\"modal-panel\">" +
          "<div class=\"modal-head\"><div><div class=\"modal-vin\">" + escapeHtml(v.vin) + "</div><div class=\"badge-row\" style=\"margin-top:6px;\">" + badges + "</div></div>" +
            "<button class=\"modal-close\" id=\"closeVehicleModal\" type=\"button\" aria-label=\"Close\">×</button></div>" +
          "<div class=\"modal-body\">" +
            "<div class=\"field\"><label for=\"vf-stock\">Stock #</label><input id=\"vf-stock\" type=\"text\" placeholder=\"e.g. H240918\" value=\"" + escapeHtml(v.stockNumber || "") + "\"></div>" +
            "<div class=\"field-row\">" +
              "<div class=\"field\"><label for=\"vf-year\">Year</label><input id=\"vf-year\" type=\"text\" inputmode=\"numeric\" value=\"" + escapeHtml(v.year || "") + "\"></div>" +
              "<div class=\"field\"><label for=\"vf-make\">Make</label><input id=\"vf-make\" type=\"text\" value=\"" + escapeHtml(v.make || "") + "\"></div>" +
            "</div>" +
            "<div class=\"field-row\">" +
              "<div class=\"field\"><label for=\"vf-model\">Model</label><input id=\"vf-model\" type=\"text\" value=\"" + escapeHtml(v.model || "") + "\"></div>" +
              "<div class=\"field\"><label for=\"vf-trim\">Trim</label><input id=\"vf-trim\" type=\"text\" value=\"" + escapeHtml(v.trim || "") + "\"></div>" +
            "</div>" +
            "<div class=\"field-row\">" +
              "<div class=\"field\"><label for=\"vf-engine\">Engine</label><input id=\"vf-engine\" type=\"text\" value=\"" + escapeHtml(v.engine || "") + "\"></div>" +
              "<div class=\"field\"><label for=\"vf-transmission\">Transmission</label><input id=\"vf-transmission\" type=\"text\" value=\"" + escapeHtml(v.transmission || "") + "\"></div>" +
            "</div>" +
            "<div class=\"field-row\">" +
              "<div class=\"field\"><label for=\"vf-location\">Location</label><select id=\"vf-location\">" + opts(LOCATIONS, v.location) + "</select></div>" +
              "<div class=\"field\"><label for=\"vf-status\">Status</label><select id=\"vf-status\">" + opts(STATUSES, v.status) + "</select></div>" +
            "</div>" +
            "<div class=\"field-row\">" +
              "<div class=\"field\"><label for=\"vf-label\">Label status</label><select id=\"vf-label\">" + opts(LABELS, v.labelStatus) + "</select></div>" +
            "</div>" +
          "</div>" +
          "<div class=\"modal-footer\">" +
            "<button id=\"removeVehicleBtn\" type=\"button\" class=\"btn btn-danger\">Remove</button>" +
            "<button id=\"printVehicleBtn\" type=\"button\" class=\"btn\">Print label</button>" +
            "<button id=\"doneVehicleBtn\" type=\"button\" class=\"btn btn-accent\" style=\"flex:1;\">Done</button>" +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function renderScanner(){
    var top = "<div class=\"scanner-top\"><span class=\"scanner-tally\">" + scanner.addedCount + " added this session</span><button class=\"scanner-x\" id=\"closeScannerBtn\" type=\"button\" aria-label=\"Close scanner\">×</button></div>";
    var body = "";

    if(scanner.mode === "camera"){
      body =
        "<div class=\"scanner-stage\">" +
          "<div id=\"scannerViewport\" class=\"scanner-viewport\"></div>" +
          (scanner.cameraError ?
            "<div class=\"scanner-error\"><span>" + escapeHtml(scanner.cameraError) + "</span></div>" :
            "<div class=\"scanner-reticle-wrap\"><div class=\"scanner-reticle\">" +
              "<div class=\"scanner-corner tl\"></div><div class=\"scanner-corner tr\"></div>" +
              "<div class=\"scanner-corner bl\"></div><div class=\"scanner-corner br\"></div>" +
              "<div class=\"scanner-scanline\"></div>" +
            "</div></div>" +
            "<div class=\"scanner-debug\" id=\"scannerDebug\"></div>" +
            "<div class=\"scanner-hint\">Fill the box with the barcode, ~4–6in away, good light, hold steady</div>"
          ) +
        "</div>" +
        "<div class=\"scanner-bottom\">" +
          "<div class=\"scanner-link-row\"><button class=\"scanner-link\" id=\"toManualBtn\" type=\"button\">Type the VIN instead</button></div>" +
        "</div>";
    } else if(scanner.mode === "manual"){
      var mv = escapeHtml(scanner.manualValue || "");
      var feedback = "";
      if(scanner.manualValue && scanner.manualValue.length === 17){
        var d = decodeVin(scanner.manualValue);
        feedback = d.checksumValid ?
          "<span style=\"color:#3FCB92;\">Checksum valid" + (d.make ? " · " + escapeHtml(d.make) : "") + (d.year ? " · " + d.year : "") + "</span>" :
          "<span style=\"color:#E7B64A;\">Checksum mismatch — double-check the VIN</span>";
      } else if(scanner.manualValue){
        feedback = "<span style=\"color:#9AA2B8;\">" + scanner.manualValue.length + " of 17 characters</span>";
      }
      body =
        "<div class=\"manual-panel\">" +
          "<h3>Enter VIN manually</h3>" +
          "<p>Type or paste the 17-character VIN from the vehicle.</p>" +
          "<input id=\"manualVinInput\" class=\"manual-input\" type=\"text\" maxlength=\"17\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" placeholder=\"e.g. 1N4AL3FP0PC654321\" value=\"" + mv + "\">" +
          "<div class=\"manual-feedback\">" + feedback + "</div>" +
          "<button id=\"manualAddBtn\" type=\"button\" class=\"btn btn-accent btn-block\">Add vehicle</button>" +
        "</div>" +
        "<div class=\"scanner-bottom\">" +
          "<div class=\"scanner-link-row\"><button class=\"scanner-link\" id=\"toCameraBtn\" type=\"button\">Use camera instead</button></div>" +
        "</div>";
    } else if(scanner.mode === "confirm"){
      var dec = decodeVin(scanner.pendingVin);
      var sub = [dec.year, dec.make].filter(Boolean).join(" · ") || "Unrecognized manufacturer prefix";
      var check = dec.checksumValid ?
        "<span class=\"pill pill-ok\">Checksum valid</span>" :
        "<span class=\"pill pill-warn\">Checksum mismatch — verify</span>";
      body =
        "<div class=\"confirm-panel\">" +
          "<div class=\"confirm-vin\">" + escapeHtml(scanner.pendingVin) + "</div>" +
          "<div class=\"confirm-sub\">" + escapeHtml(sub) + "</div>" +
          "<div class=\"badge-row\">" + check + "</div>" +
          "<div class=\"confirm-actions\">" +
            "<button id=\"rescanBtn\" type=\"button\" class=\"btn\">Rescan</button>" +
            "<button id=\"confirmAddBtn\" type=\"button\" class=\"btn btn-accent\">Add vehicle</button>" +
          "</div>" +
        "</div>";
    }

    var doneRow = "<div class=\"scanner-bottom\" style=\"padding-top:0;\"><button id=\"doneScanningBtn\" type=\"button\" class=\"btn btn-block\">Done scanning</button></div>";

    return "<div class=\"scanner-scrim\">" + top + body + (scanner.mode !== "confirm" ? doneRow : "") + "</div>";
  }

  function labelMarkup(v, s){
    var title = [v.year || "", v.make || "Unknown make", v.model || ""].filter(Boolean).join(" ") + (v.trim ? " " + v.trim : "");
    var stockHtml = v.stockNumber ?
      "<div class=\"pl-stock\">#" + escapeHtml(v.stockNumber) + "</div>" :
      "<div class=\"pl-stock pl-empty\">Not yet assigned</div>";
    return (
      "<div class=\"print-label\">" +
        "<div class=\"pl-inner\">" +
          "<div class=\"pl-header\"><span class=\"pl-store\">" + escapeHtml(s.store) + "</span><span class=\"pl-session\">" + escapeHtml(s.id) + "</span></div>" +
          "<div><span class=\"pl-stock-label\">Stock #</span>" + stockHtml + "</div>" +
          "<div class=\"pl-barcode-wrap\"><svg class=\"pl-barcode-svg\" data-vin=\"" + escapeHtml(v.vin) + "\"></svg><span class=\"pl-vin\">" + escapeHtml(v.vin) + "</span></div>" +
          "<div class=\"pl-title\">" + escapeHtml(title || "Unidentified vehicle") + "</div>" +
          "<div class=\"pl-grid\">" +
            "<div class=\"pl-cell\"><span class=\"pl-cell-label\">Engine</span><span class=\"pl-cell-value\">" + escapeHtml(v.engine || "—") + "</span></div>" +
            "<div class=\"pl-cell\"><span class=\"pl-cell-label\">Transmission</span><span class=\"pl-cell-value\">" + escapeHtml(v.transmission || "—") + "</span></div>" +
            "<div class=\"pl-cell\"><span class=\"pl-cell-label\">Location</span><span class=\"pl-cell-value\">" + escapeHtml(v.location) + "</span></div>" +
            "<div class=\"pl-cell\"><span class=\"pl-cell-label\">Status</span><span class=\"pl-cell-value\">" + escapeHtml(v.status) + "</span></div>" +
          "</div>" +
          "<div class=\"pl-footer\"><span>" + escapeHtml(v.vinSource) + " · scanned " + fmtWhen(v.addedAt || new Date().toISOString()) + "</span><span>Lot Sweep</span></div>" +
        "</div>" +
      "</div>"
    );
  }

  function renderPrintLabel(){
    if(printState.mode === "batch") return renderBulkPrintOverlay();
    return renderSinglePrintOverlay();
  }

  function renderSinglePrintOverlay(){
    var s = findSession(printState.sessionId);
    var v = s ? findVehicle(s, printState.vehicleId) : null;
    if(!v) return "";
    return (
      "<div class=\"print-scrim\" id=\"printScrim\">" +
        "<div class=\"print-scrim-top\"><span class=\"print-scrim-title\">Print vehicle label</span>" +
          "<button class=\"print-scrim-close\" id=\"closePrintBtn\" type=\"button\" aria-label=\"Close\">×</button></div>" +
        "<p class=\"print-scrim-hint\">Saves the label as a PDF — open it and click the print icon to send it to the Zebra.</p>" +
        "<div class=\"print-stage\"><div class=\"print-batch\">" + labelMarkup(v, s) + "</div></div>" +
        (printState.notice ? "<div class=\"print-notice is-error\">" + escapeHtml(printState.notice) + "</div>" : "") +
        "<div class=\"print-scrim-actions\">" +
          "<button id=\"closePrintBtn2\" type=\"button\" class=\"btn\">Close</button>" +
          "<button id=\"doPrintBtn\" type=\"button\" class=\"btn btn-accent\">Print label…</button>" +
        "</div>" +
      "</div>"
    );
  }

  function renderBulkPrintOverlay(){
    var s = findSession(printState.sessionId);
    if(!s) return "";
    var selected = printState.selected || {};
    var rows = s.vehicles.map(function(v){
      var title = [v.year || "", v.make || "Unknown make", v.model || ""].filter(Boolean).join(" ") + (v.trim ? " " + v.trim : "");
      var checked = selected[v.id] ? " checked" : "";
      var already = v.labelStatus === "Printed" ? "<span class=\"pill pill-ok\">Printed</span>" : "";
      return (
        "<label class=\"print-check-row\">" +
          "<input type=\"checkbox\" class=\"print-check\" data-vehicle-check=\"" + escapeHtml(v.id) + "\"" + checked + ">" +
          "<span class=\"print-check-main\">" +
            "<span class=\"print-check-title\">" + (v.stockNumber ? "#" + escapeHtml(v.stockNumber) : "No stock #") + already + "</span>" +
            "<span class=\"print-check-sub\">" + escapeHtml(title || "Unidentified vehicle") + " · " + escapeHtml(v.vin) + "</span>" +
          "</span>" +
        "</label>"
      );
    }).join("");
    var count = s.vehicles.filter(function(v){ return selected[v.id]; }).length;

    return (
      "<div class=\"print-scrim\" id=\"printScrim\">" +
        "<div class=\"print-scrim-top\"><span class=\"print-scrim-title\">Print vehicle labels</span>" +
          "<button class=\"print-scrim-close\" id=\"closePrintBtn\" type=\"button\" aria-label=\"Close\">×</button></div>" +
        "<p class=\"print-scrim-hint\">Saves the label as a PDF — open it and click the print icon to send it to the Zebra.</p>" +
        "<div class=\"print-check-panel\">" +
          "<div class=\"print-check-header\">" +
            "<span>" + s.vehicles.length + " vehicle" + (s.vehicles.length === 1 ? "" : "s") + " in " + escapeHtml(s.id) + "</span>" +
            "<span class=\"print-check-links\"><button type=\"button\" id=\"selectAllBtn\">All</button><button type=\"button\" id=\"selectNoneBtn\">None</button></span>" +
          "</div>" +
          "<div class=\"print-check-list\">" + rows + "</div>" +
        "</div>" +
        (printState.notice ? "<div class=\"print-notice is-error\">" + escapeHtml(printState.notice) + "</div>" : "") +
        "<div class=\"print-scrim-actions\">" +
          "<button id=\"closePrintBtn2\" type=\"button\" class=\"btn\">Close</button>" +
          "<button id=\"doPrintBtn\" type=\"button\" class=\"btn btn-accent\"" + (count === 0 ? " disabled" : "") + ">Print " + count + " label" + (count === 1 ? "" : "s") + "…</button>" +
        "</div>" +
      "</div>"
    );
  }

  /* ============ event wiring ============ */
  function wireEvents(){
    var byId = document.getElementById.bind(document);

    var storeSel = byId("activeStoreSelect");
    if(storeSel) storeSel.addEventListener("change", function(e){ state.activeStore = e.target.value; persist(); render(); });

    var dismiss = byId("dismissNotice");
    if(dismiss) dismiss.addEventListener("click", function(){ state.sampleNoticeDismissed = true; persist(); render(); });

    var startBtn = byId("startSessionBtn");
    if(startBtn) startBtn.addEventListener("click", startNewSession);

    document.querySelectorAll("[data-open-session]").forEach(function(el){
      el.addEventListener("click", function(){
        view.screen = "session"; view.sessionId = el.getAttribute("data-open-session"); render();
      });
    });

    var backBtn = byId("backBtn");
    if(backBtn) backBtn.addEventListener("click", function(){ view.screen = "home"; view.sessionId = null; render(); });

    var scanMoreBtn = byId("scanMoreBtn");
    if(scanMoreBtn) scanMoreBtn.addEventListener("click", openScanner);

    document.querySelectorAll("[data-open-vehicle]").forEach(function(el){
      el.addEventListener("click", function(){ view.editingVehicleId = el.getAttribute("data-open-vehicle"); render(); });
    });

    var closeModal = byId("closeVehicleModal");
    var doneModal = byId("doneVehicleBtn");
    var scrim = byId("vehicleModalScrim");
    [closeModal, doneModal].forEach(function(btn){ if(btn) btn.addEventListener("click", closeVehicleModal); });
    if(scrim) scrim.addEventListener("click", function(e){ if(e.target === scrim) closeVehicleModal(); });

    ["vf-stock","vf-year","vf-make","vf-model","vf-trim","vf-engine","vf-transmission","vf-location","vf-status","vf-label"].forEach(function(id){
      var el = byId(id);
      if(!el) return;
      el.addEventListener("input", function(){ updateEditingVehicle(id, el.value); });
      el.addEventListener("change", function(){ updateEditingVehicle(id, el.value); });
    });

    var removeBtn = byId("removeVehicleBtn");
    if(removeBtn) removeBtn.addEventListener("click", removeEditingVehicle);

    var printVehicleBtn = byId("printVehicleBtn");
    if(printVehicleBtn) printVehicleBtn.addEventListener("click", openPrintLabel);

    var closePrintBtn = byId("closePrintBtn");
    var closePrintBtn2 = byId("closePrintBtn2");
    [closePrintBtn, closePrintBtn2].forEach(function(btn){ if(btn) btn.addEventListener("click", closePrintLabel); });
    var printScrim = byId("printScrim");
    if(printScrim) printScrim.addEventListener("click", function(e){ if(e.target === printScrim) closePrintLabel(); });
    var doPrintBtn = byId("doPrintBtn");
    if(doPrintBtn) doPrintBtn.addEventListener("click", doPrint);

    document.querySelectorAll("[data-vehicle-check]").forEach(function(cb){
      cb.addEventListener("change", function(){
        if(!printState || !printState.selected) return;
        printState.selected[cb.getAttribute("data-vehicle-check")] = cb.checked;
        render();
      });
    });
    var selectAllBtn = byId("selectAllBtn");
    if(selectAllBtn) selectAllBtn.addEventListener("click", function(){
      var s = findSession(printState.sessionId);
      if(s) s.vehicles.forEach(function(v){ printState.selected[v.id] = true; });
      render();
    });
    var selectNoneBtn = byId("selectNoneBtn");
    if(selectNoneBtn) selectNoneBtn.addEventListener("click", function(){
      var s = findSession(printState.sessionId);
      if(s) s.vehicles.forEach(function(v){ printState.selected[v.id] = false; });
      render();
    });

    var printSessionBtn = byId("printSessionBtn");
    if(printSessionBtn) printSessionBtn.addEventListener("click", openBulkPrint);

    var closeScannerBtn = byId("closeScannerBtn");
    if(closeScannerBtn) closeScannerBtn.addEventListener("click", closeScanner);
    var doneScanningBtn = byId("doneScanningBtn");
    if(doneScanningBtn) doneScanningBtn.addEventListener("click", closeScanner);

    var toManualBtn = byId("toManualBtn");
    if(toManualBtn) toManualBtn.addEventListener("click", function(){ scanner.mode = "manual"; render(); });
    var toCameraBtn = byId("toCameraBtn");
    if(toCameraBtn) toCameraBtn.addEventListener("click", function(){ scanner.mode = "camera"; scanner.cameraError = null; render(); });

    var manualInput = byId("manualVinInput");
    if(manualInput){
      manualInput.addEventListener("input", function(){
        scanner.manualValue = manualInput.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,"");
        var fb = document.querySelector(".manual-feedback");
        if(fb){
          if(scanner.manualValue.length === 17){
            var d = decodeVin(scanner.manualValue);
            fb.innerHTML = d.checksumValid ?
              "<span style=\"color:#3FCB92;\">Checksum valid" + (d.make ? " · " + escapeHtml(d.make) : "") + (d.year ? " · " + d.year : "") + "</span>" :
              "<span style=\"color:#E7B64A;\">Checksum mismatch — double-check the VIN</span>";
          } else {
            fb.innerHTML = "<span style=\"color:#9AA2B8;\">" + scanner.manualValue.length + " of 17 characters</span>";
          }
        }
        manualInput.value = scanner.manualValue;
      });
      manualInput.addEventListener("keydown", function(e){
        if(e.key === "Enter" && scanner.manualValue.length === 17){
          e.preventDefault();
          addManualVehicle();
        }
      });
    }
    var manualAddBtn = byId("manualAddBtn");
    if(manualAddBtn) manualAddBtn.addEventListener("click", addManualVehicle);

    var rescanBtn = byId("rescanBtn");
    if(rescanBtn) rescanBtn.addEventListener("click", function(){ scanner.mode = "camera"; scanner.pendingVin = null; scanner.lastRead = null; scanner.lastReadStreak = 0; render(); });
    var confirmAddBtn = byId("confirmAddBtn");
    if(confirmAddBtn) confirmAddBtn.addEventListener("click", confirmAddVehicle);
  }

  /* ============ actions ============ */
  function startNewSession(){
    var id = "VS-" + state.nextSessionNum;
    state.nextSessionNum++;
    var session = {id:id, store:state.activeStore, createdAt: new Date().toISOString(), vehicles:[]};
    state.sessions.push(session);
    persist();
    view.screen = "session"; view.sessionId = id;
    openScanner();
  }

  function openScanner(){
    scanner = {open:true, mode:"camera", pendingVin:null, addedCount:0, cameraError:null, manualValue:"", lastRead:null, lastReadStreak:0};
    render();
  }
  function closeScanner(){
    stopQuagga();
    scanner.open = false;
    render();
  }

  function newVehicleFromVin(vin, source){
    var d = decodeVin(vin);
    state.nextVehicleNum++;
    return {
      id: "v" + state.nextVehicleNum, vin: vin, vinSource: source, stockNumber: "", addedAt: new Date().toISOString(),
      year: d.year, make: d.make, model: "", trim: "", engine: "", transmission: "",
      location: LOCATIONS[0], status: STATUSES[0], labelStatus: LABELS[0]
    };
  }

  function addManualVehicle(){
    var vin = (scanner.manualValue || "").toUpperCase();
    if(vin.length !== 17) return;
    var s = findSession(view.sessionId);
    if(!s) return;
    s.vehicles.push(newVehicleFromVin(vin, "Manual"));
    scanner.addedCount++;
    scanner.manualValue = "";
    persist();
    render();
  }

  function confirmAddVehicle(){
    var s = findSession(view.sessionId);
    if(!s || !scanner.pendingVin) return;
    s.vehicles.push(newVehicleFromVin(scanner.pendingVin, "Scanned"));
    scanner.addedCount++;
    scanner.pendingVin = null;
    scanner.mode = "camera";
    scanner.lastRead = null;
    scanner.lastReadStreak = 0;
    persist();
    render();
  }

  function closeVehicleModal(){ view.editingVehicleId = null; render(); }

  function openPrintLabel(){
    printState = { sessionId: view.sessionId, mode:"single", vehicleId: view.editingVehicleId, notice:null };
    view.editingVehicleId = null;
    render();
  }
  function openBulkPrint(){
    var s = findSession(view.sessionId);
    if(!s || !s.vehicles.length) return;
    var sel = {};
    s.vehicles.forEach(function(v){ sel[v.id] = true; });
    printState = { sessionId: view.sessionId, mode:"batch", selected: sel, notice:null };
    render();
  }
  function closePrintLabel(){ printState = null; render(); }
  function setPrintNotice(msg){
    if(!printState) return;
    printState.notice = msg;
    render();
  }

  /* ---- label PDF generation (client-side, no server round-trip) ---- */
  function drawBarcodeDataUrl(vin){
    var canvas = document.createElement("canvas");
    JsBarcode(canvas, vin, { format:"CODE39", displayValue:false, margin:0, height:120, width:3, background:"#ffffff", lineColor:"#000000" });
    return canvas.toDataURL("image/png");
  }
  function fitTextLine(doc, text, maxWidth, startSize, minSize, font, style){
    doc.setFont(font, style);
    var size = startSize;
    doc.setFontSize(size);
    while(size > minSize && doc.getTextWidth(text) > maxWidth){
      size -= 0.5;
      doc.setFontSize(size);
    }
    if(doc.getTextWidth(text) > maxWidth){
      var t = text;
      while(t.length > 1 && doc.getTextWidth(t + "…") > maxWidth){
        t = t.slice(0, -1);
      }
      text = t + "…";
    }
    return text;
  }
  function buildLabelPdf(vehicles, session){
    var doc = new window.jspdf.jsPDF({ unit:"in", format:[4,3], orientation:"landscape" });
    vehicles.forEach(function(v, idx){
      if(idx > 0) doc.addPage([4,3], "landscape");
      var M = 0.15;
      doc.setDrawColor(0,0,0);

      doc.setFont("helvetica","bold"); doc.setFontSize(10);
      doc.text((session.store || "").toUpperCase(), M, 0.22);
      doc.setFont("courier","normal"); doc.setFontSize(9);
      doc.text(session.id, 4 - M, 0.22, {align:"right"});
      doc.setLineWidth(0.018);
      doc.line(M, 0.30, 4 - M, 0.30);

      doc.setFont("helvetica","bold"); doc.setFontSize(8);
      doc.text("STOCK #", M, 0.48);
      if(v.stockNumber){
        var stockText = fitTextLine(doc, "#" + v.stockNumber, 4 - M * 2, 32, 16, "helvetica", "bold");
        doc.text(stockText, M, 0.95);
      } else {
        doc.setFont("helvetica","italic"); doc.setFontSize(15);
        doc.text("Not yet assigned", M, 0.78);
      }

      var bcW = 3.5, bcH = 0.52, bcX = (4 - bcW) / 2, bcY = 1.08;
      try{ doc.addImage(drawBarcodeDataUrl(v.vin), "PNG", bcX, bcY, bcW, bcH); }catch(e){}
      doc.setFont("courier","bold"); doc.setFontSize(10);
      doc.text(v.vin, 2, bcY + bcH + 0.16, {align:"center"});

      doc.setLineWidth(0.012);
      doc.line(M, 1.86, 4 - M, 1.86);
      var title = [v.year || "", v.make || "Unknown make", v.model || ""].filter(Boolean).join(" ") + (v.trim ? " " + v.trim : "");
      title = title || "Unidentified vehicle";
      title = fitTextLine(doc, title, 4 - M * 2, 16, 10, "helvetica", "bold");
      doc.text(title, M, 2.08);

      var col2X = 2.05;
      function cell(x, y, label, value){
        doc.setFont("helvetica","bold"); doc.setFontSize(7);
        doc.text(label.toUpperCase(), x, y);
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
        doc.text(value || "—", x, y + 0.17);
      }
      cell(M, 2.23, "Engine", v.engine);
      cell(col2X, 2.23, "Transmission", v.transmission);
      cell(M, 2.52, "Location", v.location);
      cell(col2X, 2.52, "Status", v.status);

      doc.setLineWidth(0.008);
      doc.line(M, 2.75, 4 - M, 2.75);
      doc.setFont("helvetica","normal"); doc.setFontSize(7);
      doc.text((v.vinSource || "") + " · scanned " + fmtWhen(v.addedAt || new Date().toISOString()), M, 2.86);
      doc.text("Lot Sweep", 4 - M, 2.86, {align:"right"});
    });
    return doc;
  }

  var downloadsCap = null;
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(function(cap){ downloadsCap = cap; }).catch(function(){ downloadsCap = null; });
  }

  function tryWindowOpen(blob){
    var opened = null;
    try{
      var url = URL.createObjectURL(blob);
      opened = window.open(url, "_blank");
    }catch(e){ opened = null; }
    return !!opened;
  }

  function deliverPdf(blob, filename){
    // Prefer the downloads capability: it's a direct save-dialog call to the
    // Claude host, not a browser tab navigation, so it isn't caught by
    // ad-block / popup-block extensions the way window.open(blob:) can be.
    if(downloadsCap){
      downloadsCap.save({ filename: filename, data: blob }).then(function(){
        setPrintNotice(null);
      }).catch(function(err){
        var code = err && err.code;
        if(code === "declined"){ setPrintNotice(null); return; }
        if(code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed"){
          if(tryWindowOpen(blob)){ setPrintNotice(null); return; }
          setPrintNotice("Couldn't save or open the label here — try opening Lot Sweep in its own browser tab.");
          return;
        }
        setPrintNotice(code === "too_large" ? "That file was too large to save." : "Couldn't save the label (" + (code || "unknown error") + ").");
      });
      return;
    }
    if(tryWindowOpen(blob)){
      setPrintNotice(null);
      return;
    }
    setPrintNotice("Couldn't open or save the label — try opening Lot Sweep in its own browser tab.");
  }

  function doPrint(){
    if(!printState) return;
    var s = findSession(printState.sessionId);
    if(!s) return;
    var vehicles;
    if(printState.mode === "batch"){
      var selected = printState.selected || {};
      vehicles = s.vehicles.filter(function(v){ return selected[v.id]; });
    } else {
      var v = findVehicle(s, printState.vehicleId);
      vehicles = v ? [v] : [];
    }
    if(!vehicles.length) return;
    if(typeof window.jspdf === "undefined" || typeof JsBarcode === "undefined"){
      setPrintNotice("Still loading — give it a second and try again.");
      return;
    }
    var doc;
    try{ doc = buildLabelPdf(vehicles, s); }
    catch(e){ setPrintNotice("Couldn't build the label PDF."); return; }
    var blob = doc.output("blob");
    var filename = (vehicles.length === 1 ?
      "label-" + (vehicles[0].stockNumber || vehicles[0].vin) :
      "labels-" + s.id + "-" + vehicles.length) + ".pdf";
    vehicles.forEach(function(v){ v.labelStatus = "Printed"; });
    persist();
    deliverPdf(blob, filename);
  }

  function drawPrintBarcode(){
    if(!printState || typeof JsBarcode === "undefined") return;
    document.querySelectorAll(".pl-barcode-svg").forEach(function(svg){
      var vin = svg.getAttribute("data-vin");
      if(!vin) return;
      try{
        JsBarcode(svg, vin, {
          format:"CODE39", displayValue:false, margin:0, height:44, width:1.6, background:"#FFFFFF", lineColor:"#000000"
        });
        var w = parseFloat(svg.getAttribute("width")), h = parseFloat(svg.getAttribute("height"));
        if(w && h){
          svg.setAttribute("viewBox", "0 0 " + w + " " + h);
          svg.removeAttribute("width");
          svg.removeAttribute("height");
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }
      }catch(e){}
    });
  }

  function updateEditingVehicle(fieldId, value){
    var s = findSession(view.sessionId);
    var v = s ? findVehicle(s, view.editingVehicleId) : null;
    if(!v) return;
    var map = {
      "vf-stock":"stockNumber",
      "vf-year":"year", "vf-make":"make", "vf-model":"model", "vf-trim":"trim",
      "vf-engine":"engine", "vf-transmission":"transmission",
      "vf-location":"location", "vf-status":"status", "vf-label":"labelStatus"
    };
    var key = map[fieldId];
    if(!key) return;
    v[key] = key === "year" ? (value ? parseInt(value,10) || value : "") : value;
    persist();
    if(key === "location" || key === "status" || key === "labelStatus") render();
  }

  function removeEditingVehicle(){
    var s = findSession(view.sessionId);
    if(!s) return;
    s.vehicles = s.vehicles.filter(function(v){ return v.id !== view.editingVehicleId; });
    view.editingVehicleId = null;
    persist();
    render();
  }

  /* ============ Quagga integration ============ */
  function startQuagga(){
    var target = document.getElementById("scannerViewport");
    if(!target || typeof Quagga === "undefined"){
      scanner.cameraError = "Camera scanning isn't available here — use “Type the VIN instead.”";
      render();
      return;
    }
    var settled = false;
    // Watchdog: some camera-permission failures (especially when access is
    // blocked at the browser/host level rather than user-declined) never
    // reach Quagga's init callback at all. Without this, the scanner screen
    // would just hang forever with no way to fall back to manual entry.
    var watchdog = setTimeout(function(){
      if(settled) return;
      settled = true;
      scanner.cameraError = "Couldn't reach the camera — use “Type the VIN instead.”";
      render();
    }, 6000);
    try{
      Quagga.init({
        inputStream: {
          name:"Live", type:"LiveStream", target:target,
          constraints:{
            facingMode:"environment",
            width:{ min:640, ideal:1280, max:1920 },
            height:{ min:480, ideal:720, max:1080 }
          }
          // No `area` crop here on purpose: it restricts Quagga's decode
          // region to a percentage of the raw camera stream, which is not
          // guaranteed to line up with what the on-screen reticle (a plain
          // CSS overlay) visually shows once `object-fit:cover` crops the
          // displayed video differently from the raw stream. A mismatch
          // there would silently exclude the real barcode from ever being
          // analyzed even though it looks centered on screen. Scanning the
          // full frame costs a bit of CPU but guarantees nothing visible
          // is ever skipped.
        },
        locator: { patchSize:"large", halfSample:false },
        // Forced to 0 on purpose: QuaggaJS's web-worker pipeline has a
        // long-standing iOS Safari bug where the locate step (which runs
        // fine and reports candidate boxes back to onProcessed — hence the
        // reticle going green) never completes a decode inside the worker,
        // so onDetected simply never fires, no matter how good the shot is.
        // Running single-threaded on the main thread costs some frame rate
        // but is the only way decode actually completes on iPhone Safari.
        numOfWorkers: 0,
        decoder: { readers:["code_39_vin_reader","code_39_reader","code_128_reader"] },
        locate: true
      }, function(err){
        if(settled) return;
        settled = true;
        clearTimeout(watchdog);
        if(err){
          scanner.cameraError = "Couldn't reach the camera — use “Type the VIN instead.”";
          render();
          return;
        }
        quaggaActive = true;
        Quagga.start();
        Quagga.onDetected(handleDetected);
        // Light DOM-only feedback (never call render() here — that would
        // tear down and rebuild the live video element on every frame).
        Quagga.onProcessed(function(result){
          var reticle = document.querySelector(".scanner-reticle");
          if(!reticle) return;
          var seeing = !!(result && ((result.boxes && result.boxes.length) || result.box));
          reticle.classList.toggle("is-reading", seeing);
        });
      });
    }catch(e){
      if(settled) return;
      settled = true;
      clearTimeout(watchdog);
      scanner.cameraError = "Couldn't reach the camera — use “Type the VIN instead.”";
      render();
    }
  }
  function stopQuagga(){
    if(quaggaActive && typeof Quagga !== "undefined"){
      try{ Quagga.offDetected(handleDetected); Quagga.stop(); }catch(e){}
    }
    quaggaActive = false;
  }
  // Single-frame barcode reads are noisy — a busy background, glare, or a
  // slightly skewed angle regularly produces a plausible-looking but wrong
  // 17-character read. Rather than trust the first hit, require either a
  // checksum-valid VIN read twice in a row, or the same exact code (even if
  // checksum fails, since not all VINs use the check-digit scheme) three
  // times in a row, before accepting it as real.
  function handleDetected(result){
    if(scanner.mode !== "camera") return;
    var cr = result && result.codeResult;
    var raw = (cr && cr.code) || "";
    var code = raw.replace(/[^A-Z0-9]/gi,"").toUpperCase();
    // Visible on-screen debug readout — lets us see exactly what the decoder
    // is producing without needing phone dev tools.
    var dbg = document.getElementById("scannerDebug");
    if(dbg){
      dbg.textContent = "read: \"" + raw + "\" (" + raw.length + " chars, " +
        (cr && cr.format ? cr.format : "?") + ", err " + (cr && cr.error != null ? cr.error.toFixed(2) : "?") + ")";
    }
    if(code.length !== 17 || !vinFormatOk(code)) return;
    if(code === scanner.lastRead){
      scanner.lastReadStreak++;
    } else {
      scanner.lastRead = code;
      scanner.lastReadStreak = 1;
    }
    var checksumOk = vinChecksumValid(code);
    var confirmed = (checksumOk && scanner.lastReadStreak >= 2) || scanner.lastReadStreak >= 3;
    if(!confirmed) return;
    stopQuagga();
    scanner.mode = "confirm";
    scanner.pendingVin = code;
    scanner.lastRead = null;
    scanner.lastReadStreak = 0;
    render();
  }
  function afterRender(){
    if(scanner.open && scanner.mode === "camera" && !scanner.cameraError){
      if(!quaggaActive) startQuagga();
    } else {
      if(quaggaActive) stopQuagga();
    }
    if(scanner.open && scanner.mode === "manual"){
      var mi = document.getElementById("manualVinInput");
      if(mi && document.activeElement !== mi) mi.focus();
    }
    if(printState) drawPrintBarcode();
  }

  /* ============ boot ============ */
  function start(hotData){
    state = (hotData && Array.isArray(hotData.sessions)) ? hotData : loadPersisted();
    render();
  }
  if(window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){ return state; });
  }
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude && window.claude.hot ? window.claude.hot.data : {});
  }
})();
</script>
